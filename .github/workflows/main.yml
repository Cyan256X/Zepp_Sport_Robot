name: 自动任务-修改Zepp当天运动数据

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 23 * * *'   # 北京时间 07:00-07:50,每10分钟触发一次(步数逐渐增长)
    - cron: '0 0 * * *'       # 北京时间 08:00,触发一次(达到当日目标步数)

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: '检出仓库代码'
        uses: actions/checkout@v6
      - name: '设置 Python 环境'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.0'
      - name: '安装依赖项'
        run: pip install requests==2.26.0
      - name: '运行主程序'
        env:
          ACCOUNT: ${{ secrets.ACCOUNT }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: python ./main.py
